{% extends "base.html" %}
{% block title %}Login · ImpactBridge AI{% endblock %}
{% block content %}
<section class="page-header">
    <div class="container">
        <p class="kicker" style="color:var(--teal-500)">WELCOME BACK</p>
        <h1>Login</h1>
    </div>
</section>
<section class="section">
    <div class="container" style="max-width:440px">
        <div class="card">
            <div class="card-body">
                <form method="post">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="field"><label>Email</label><input type="email" name="email" required
                            placeholder="you@example.com"></div>
                    <div class="field"><label>Password</label><input type="password" name="password" required
                            placeholder="••••••••"></div>
                    <button class="btn btn-lg btn-primary" style="width:100%"><i
                            class="fa-solid fa-right-to-bracket"></i> Login</button>
                </form>
                <p style="text-align:center;margin-top:var(--space-3)">New here? <a
                        href="{{ url_for('auth.register') }}">Create an account</a></p>
            </div>
        </div>
    </div>
</section>
{% endblock %}
