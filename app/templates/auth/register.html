{% extends "base.html" %}
{% block title %}Register · ImpactBridge AI{% endblock %}
{% block content %}
<section class="page-header">
    <div class="container">
        <p class="kicker" style="color:var(--teal-500)">JOIN US</p>
        <h1>Create an Account</h1>
    </div>
</section>
<section class="section">
    <div class="container" style="max-width:520px">
        <div class="card">
            <div class="card-body">
                <form method="post">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="field"><label>Full name</label><input type="text" name="full_name" required
                            placeholder="Your name"></div>
                    <div class="field"><label>Email</label><input type="email" name="email" required
                            placeholder="you@example.com"></div>
                    <div class="form-grid">
                        <div class="field"><label>Phone</label><input type="tel" name="phone"
                                placeholder="+91 98765 43210"></div>
                        <div class="field"><label>City</label><input type="text" name="city" placeholder="Pune"></div>
                    </div>
                    <div class="field"><label>Password</label><input type="password" name="password" required
                            minlength="8" placeholder="At least 8 characters"></div>
                    <button class="btn btn-lg btn-primary" style="width:100%"><i class="fa-solid fa-user-plus"></i>
                        Create Account</button>
                </form>
                <p style="text-align:center;margin-top:var(--space-3)">Already have an account? <a
                        href="{{ url_for('auth.login') }}">Login</a></p>
            </div>
        </div>
    </div>
</section>
{% endblock %}
