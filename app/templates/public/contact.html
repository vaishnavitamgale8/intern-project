{% extends "base.html" %}
{% block title %}Contact Us · ImpactBridge AI{% endblock %}
{% block content %}
<section class="page-header">
    <div class="container">
        <p class="kicker" style="color:var(--teal-500)">GET IN TOUCH</p>
        <h1>Contact Us</h1>
        <p>Questions, feedback or partnership ideas? We would love to hear from you.</p>
    </div>
</section>
<section class="section">
    <div class="container" style="max-width:640px">
        <div class="card">
            <div class="card-body">
                <form method="post">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="form-grid">
                        <div class="field"><label>Name</label><input type="text" name="name" required
                                placeholder="Your name"></div>
                        <div class="field"><label>Email</label><input type="email" name="email" required
                                placeholder="you@example.com"></div>
                    </div>
                    <div class="field"><label>Subject</label><input type="text" name="subject" required
                            placeholder="How can we help?"></div>
                    <div class="field"><label>Message</label><textarea name="message" rows="5" required
                            placeholder="Write your message…"></textarea></div>
                    <button class="btn btn-lg btn-primary" style="width:100%"><i class="fa-solid fa-paper-plane"></i>
                        Send Message</button>
                </form>
            </div>
        </div>
    </div>
</section>
{% endblock %}
